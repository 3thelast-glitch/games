name: Playwright Responsive Smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked application and Playwright dependencies
        run: npm ci
      - name: Remove unrelated Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run RTL/LTR responsive smoke matrix
        env:
          PW_MATRIX: smoke
        run: npx playwright test --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-responsive-smoke
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 14

  firefox-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked application and Playwright dependencies
        run: npm ci
      - name: Remove unrelated Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Run Firefox touch and geometry regression suite
        run: npx playwright test --project=firefox tests/e2e/games/touch-and-geometry.spec.ts
      - name: Upload Firefox report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-firefox-geometry
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 14

name: Digital multiplayer migration
on:
  push:
    branches: [feat/digital-3-4-player]
    paths:
      - scripts/migrate_digital_multiplayer.py
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/digital-3-4-player
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/migrate_digital_multiplayer.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated multiplayer support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/digital-multiplayer-migration.yml scripts/migrate_digital_multiplayer.py
          git add -A
          git commit -m "Add 3-4 player Digital Game multiplayer"
          git push origin HEAD:feat/digital-3-4-player

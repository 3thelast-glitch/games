name: Patch Digital opening meld rule
on:
  push:
    branches:
      - fix/digital-opening-meld-30
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/digital-opening-meld-30
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Patch Digital Game opening rule and tests
        run: python3 .github/patch-digital-opening-meld.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit verified patch
        shell: bash
        run: |
          rm .github/workflows/patch-digital-opening-meld.yml .github/patch-digital-opening-meld.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Digital Game opening meld threshold"
          git push origin HEAD:fix/digital-opening-meld-30

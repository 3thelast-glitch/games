name: Apply Reversi Integration

on:
  push:
    branches:
      - feature/reversi-production

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply integration patches
        run: node scripts/apply-reversi-integration.mjs
      - name: Commit integration changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/components.tsx apps/mobile/src/ClassicArt.tsx apps/mobile/src/i18n.tsx tests/classic-games.test.ts tests/server.test.ts tests/ui.test.tsx
          git commit -m "Integrate Reversi across UI, localization, and regression tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"

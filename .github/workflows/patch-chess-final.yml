name: Finalize Chess coverage
on:
  push:
    branches: [feature/chess]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/chess
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Finalize Chess coverage and art
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          server = Path('tests/server.test.ts')
          text = server.read_text()
          text = replace_once(text, "for (const id of ['checkers', 'gomoku', 'nineMensMorris', 'connectFour', 'reversi']) {", "for (const id of ['checkers', 'gomoku', 'nineMensMorris', 'connectFour', 'reversi', 'chess']) {", 'server game list')
          server.write_text(text)

          chess_tests = Path('tests/chess.test.ts')
          text = chess_tests.read_text()
          text = replace_once(text, "import test from 'node:test';\nimport assert from 'node:assert/strict';\n", "import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { chooseMove } from '../packages/core/src/ai.ts';\nimport { asPlugin } from '../packages/core/src/game.ts';\n", 'AI imports')
          text = replace_once(text, "  applyChess,\n", "  applyChess,\n  chessEngine,\n", 'engine import')
          text += "\n\ntest('Chess is compatible with every shared AI difficulty', () => {\n  const state = createChess();\n  const plugin = asPlugin(chessEngine);\n  const legal = chessLegalMoves(state);\n  for (const difficulty of ['easy', 'medium', 'hard'] as const) {\n    const move = chooseMove(plugin, state, difficulty, { random: () => 0, budgetMs: 40 });\n    assert.ok(move);\n    assert.ok(legal.some((candidate) => JSON.stringify(candidate) === JSON.stringify(move)));\n  }\n});\n"
          chess_tests.write_text(text)

          components = Path('apps/mobile/src/components.tsx')
          text = components.read_text()
          text = replace_once(text, "['checkers', 'gomoku', 'nineMensMorris', 'connectFour', 'reversi', 'digitalGame'].includes(game)", "['checkers', 'gomoku', 'nineMensMorris', 'connectFour', 'reversi', 'digitalGame', 'chess'].includes(game)", 'Chess art routing')
          components.write_text(text)

          art = Path('apps/mobile/src/ClassicArt.tsx')
          text = art.read_text()
          anchor = "      {game === 'checkers' && (\n"
          chess_art = "      {game === 'chess' && (\n        <>\n          {Array.from({ length: 64 }, (_, i) => (\n            <rect key={i} x={36 + (i % 8) * 46} y={36 + Math.floor(i / 8) * 46} width=\"46\" height=\"46\" fill={(Math.floor(i / 8) + (i % 8)) % 2 ? '#536258' : '#d8cbb5'} />\n          ))}\n          <text x=\"82\" y=\"119\" textAnchor=\"middle\" fontSize=\"54\" fill=\"#17211e\">♞</text>\n          <text x=\"174\" y=\"119\" textAnchor=\"middle\" fontSize=\"54\" fill=\"#17211e\">♛</text>\n          <text x=\"266\" y=\"119\" textAnchor=\"middle\" fontSize=\"54\" fill=\"#17211e\">♚</text>\n          <text x=\"358\" y=\"119\" textAnchor=\"middle\" fontSize=\"54\" fill=\"#17211e\">♜</text>\n          <text x=\"128\" y=\"349\" textAnchor=\"middle\" fontSize=\"54\" fill=\"#fff8e9\">♖</text>\n          <text x=\"220\" y=\"349\" textAnchor=\"middle\" fontSize=\"54\" fill=\"#fff8e9\">♔</text>\n          <text x=\"312\" y=\"349\" textAnchor=\"middle\" fontSize=\"54\" fill=\"#fff8e9\">♕</text>\n          <text x=\"220\" y=\"257\" textAnchor=\"middle\" fontSize=\"52\" fill=\"#fff8e9\">♙</text>\n          <text x=\"266\" y=\"211\" textAnchor=\"middle\" fontSize=\"52\" fill=\"#17211e\">♟</text>\n        </>\n      )}\n"
          text = replace_once(text, anchor, chess_art + anchor, 'Chess card art')
          art.write_text(text)
          PY
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - name: Commit verified final Chess changes
        shell: bash
        run: |
          rm .github/workflows/patch-chess-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/server.test.ts tests/chess.test.ts apps/mobile/src/components.tsx apps/mobile/src/ClassicArt.tsx .github/workflows/patch-chess-final.yml
          git commit -m "Complete Chess coverage and presentation"
          git push origin HEAD:feature/chess

name: Build iOS
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'native/**'
      - 'scripts/mobile.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'native/**'
      - 'scripts/mobile.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run mobile:ios
      - name: Build iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee xcodebuild.log
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee xcodebuild.log
          fi
      - name: Upload xcodebuild diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 3

name: Digital turn timer validation
on:
  push:
    branches: [feat/digital-turn-timers]
    paths:
      - scripts/fix_digital_turn_timer_build.py
      - .github/workflows/digital-turn-timers-fix.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/digital-turn-timers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply turn timer changes
        run: |
          python3 scripts/migrate_digital_turn_timers.py
          python3 scripts/fix_digital_turn_timer_build.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated turn timers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/digital-turn-timers-migration.yml \
            .github/workflows/digital-turn-timers-fix.yml \
            scripts/migrate_digital_turn_timers.py \
            scripts/fix_digital_turn_timer_build.py
          git add -A
          git commit -m "Add selectable Digital Game turn timers"
          git push origin HEAD:feat/digital-turn-timers

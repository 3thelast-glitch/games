name: Validate Board Arena
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: python scripts/apply-reversi-timer-fix.py
      - run: python scripts/adjust-reversi-timer-test.py
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - name: Commit validated Reversi timer fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Reversi turn timer options"
          git push origin HEAD:fix/reversi-timer-options
      - uses: actions/upload-artifact@v7
        with:
          name: board-arena-web-server
          path: dist
          retention-days: 14

name: Validate NAQLA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: naqla-web-server
          path: dist
          retention-days: 14

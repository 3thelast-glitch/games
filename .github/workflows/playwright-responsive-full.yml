name: Playwright Responsive Full Matrix

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-responsive-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-full:
    if: github.event_name != 'pull_request' || github.head_ref == 'feat/target-games-visual-overhaul' || github.head_ref == 'feat/naval-battle'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked application and Playwright dependencies
        run: npm ci
      - name: Remove unrelated Chrome apt source
        run: grep -rl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full responsive matrix in English and Arabic
        env:
          PW_MATRIX: full
        run: npx playwright test --project=chromium tests/e2e/layout/responsive-matrix.spec.ts
      - name: Run Naval Battle placement and battle matrix
        run: npx playwright test --project=chromium tests/e2e/games/naval-battle-matrix.spec.ts
      - name: Capture Naval Battle visual evidence
        run: npx playwright test --project=chromium tests/e2e/visual/naval-battle-screenshots.spec.ts
      - name: Preserve Naval Battle visual evidence
        run: |
          mkdir -p artifacts/naval-battle
          find test-results/playwright -type f -name '*.png' -exec cp {} artifacts/naval-battle/ \;
          count="$(find artifacts/naval-battle -type f -name '*.png' | wc -l)"
          echo "Preserved $count Naval Battle screenshots"
          test "$count" -ge 18
      - name: Run Chromium touch and geometry regression suite
        run: npx playwright test --project=chromium tests/e2e/games/touch-and-geometry.spec.ts
      - name: Upload Chromium report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-chromium-full
          path: |
            playwright-report
            test-results/playwright
            artifacts/naval-battle
          if-no-files-found: ignore
          retention-days: 14

  cross-browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked application and Playwright dependencies
        run: npm ci
      - name: Remove unrelated Chrome apt source
        run: grep -rl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run representative RTL/LTR cross-browser matrix
        env:
          PW_MATRIX: cross-browser
        run: npx playwright test --project=${{ matrix.browser }} tests/e2e/layout/responsive-matrix.spec.ts
      - name: Run browser-specific touch/geometry suite
        run: npx playwright test --project=${{ matrix.browser }} tests/e2e/games/touch-and-geometry.spec.ts
      - name: Upload ${{ matrix.browser }} report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}-cross-browser
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 14

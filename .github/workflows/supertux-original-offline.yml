name: SuperTux original offline - boot and touch proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/src/CommunityGamesPage.tsx'
      - 'apps/mobile/src/community-games.css'
      - 'scripts/package-supertux-web.mjs'
      - 'scripts/build-supertux-original-wasm.sh'
      - 'scripts/supertux-touch-controls.js'
      - 'scripts/verify-supertux-browser.mjs'
      - 'tests/supertux-original-packaging.test.ts'
      - '.github/workflows/supertux-original-offline.yml'
permissions:
  contents: read
  actions: read
jobs:
  compile-original-supertux:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: SuperTux/supertux
          ref: c837f4f5d8b5945e22df1e36ab8f05801cf08f9c
          fetch-depth: 0
          submodules: recursive
          path: .cache/supertux-source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL_image
          ref: 0891fc30428b518e7d018677bd6fa95c1a50f4c6
          path: .cache/SDL_image
          persist-credentials: false
      - name: Install official Emscripten and C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build build-essential curl zip rsync
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest
          vcpkg integrate install
      - name: Build original SuperTux with REAL SDL3_image and strict link symbols
        run: |
          bash scripts/build-supertux-original-wasm.sh \
            "$GITHUB_WORKSPACE/.cache/supertux-source" \
            "$GITHUB_WORKSPACE/.cache/SDL_image" \
            "$GITHUB_WORKSPACE/.cache/supertux-fixed"
      - name: Upload reproducibly compiled original SuperTux game
        uses: actions/upload-artifact@v7
        with:
          name: SuperTux-fixed-real-SDL3-image-wasm
          path: .cache/supertux-fixed/
          retention-days: 7
          if-no-files-found: error

  original-supertux-offline:
    needs: compile-original-supertux
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VITE_SERVER_URL: ''
      VITE_FREECIV_WEB_URL: ''
    steps:
      - name: Checkout NAQLA
        uses: actions/checkout@v7
      - name: Download THIS RUN's real SDL3_image-fixed original SuperTux build
        uses: actions/download-artifact@v7
        with:
          name: SuperTux-fixed-real-SDL3-image-wasm
          path: .cache/supertux-wasm
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Package verified original game files into NAQLA
        run: |
          test -s .cache/supertux-wasm/supertux2.js
          test -s .cache/supertux-wasm/supertux2.wasm
          test -s .cache/supertux-wasm/supertux2.data
          test -s .cache/supertux-wasm/supertux2.html
          node scripts/package-supertux-web.mjs .cache/supertux-wasm
          grep -q '"offline": true' apps/mobile/public/third-party/supertux/naqla-runtime.json
          test -s apps/mobile/public/third-party/supertux/naqla-supertux-touch.js
      - name: Test NAQLA and SuperTux packager
        run: |
          npm ci
          npm test
      - name: Build full NAQLA web app with original SuperTux
        run: |
          npm run build
          test -s dist/mobile/third-party/supertux/supertux2.wasm
          test -s dist/mobile/third-party/supertux/supertux2.data
      - name: Open original C++ game in Chromium and prove touch input
        run: |
          npx playwright install --with-deps chromium
          PORT=8787 DATABASE_PATH="$RUNNER_TEMP/naqla-supertux.db" \
            node dist/server/index.mjs > "$RUNNER_TEMP/supertux-server.log" 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8787/api/health -o /dev/null; then break; fi
            sleep 2
          done
          node scripts/verify-supertux-browser.mjs http://127.0.0.1:8787
      - name: Assemble full offline-test Android APK
        run: |
          node scripts/mobile.mjs android
          test -s android/app/src/main/assets/public/third-party/supertux/supertux2.wasm
          test -s android/app/src/main/assets/public/third-party/supertux/supertux2.data
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload test APK with original SuperTux levels and audio
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NAQLA-SuperTux-original-offline-Android-TEST
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload boot and gameplay diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NAQLA-SuperTux-original-gameplay-evidence
          path: artifacts/supertux/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show server log on failure
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/supertux-server.log"; then
            tail -n 160 "$RUNNER_TEMP/supertux-server.log"
          fi
